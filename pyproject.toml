[tool.poetry]
name = "evsemaster"
version = "2.0.3"
description = "Python implementation of the EVSEMaster App"
authors = [
    "Rafaël Schridi <rafael@schridi.nl>"
]
license = "MIT"
readme = "README.md"
packages = [
    { include = "evsemaster" }
]

[tool.poetry.dependencies]
python = ">=3.14"
pydantic = ">=2.0,<3.0"
tzdata = ">=2025.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.6"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
poethepoet = "^0.48.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM103", 
    "SIM108",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poe.tasks]
lint = "ruff check"
format = "ruff format"
test = "pytest"
check = ["lint", "test"]